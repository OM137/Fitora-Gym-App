services:
  - type: web
    name: fitora-gym-app
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm migrate:production
    startCommand: pnpm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitora-postgres
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: fitora-postgres
          property: connectionString

databases:
  - name: fitora-postgres
    databaseName: fitora
    region: singapore
    plan: 0.1c-256mb
